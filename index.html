    case 'share':{const u=location.href.split('#')[0];try{if(navigator.share){await navigator.share({title:'Hifz Planner',text:'A free daily Quran memorization planner',url:u});return}}catch(e){}try{await navigator.clipboard.writeText(u);alert('Link copied:\n'+u)}catch(e){prompt('Copy this link:',u)}return}
    case 'install':if(deferredInstall){deferredInstall.prompt();deferredInstall=null;return}$('#installhelp').classList.toggle('hidden');return;
    case 'export':{const b=new Blob([JSON.stringify(state)],{type:'application/json'});const a2=document.createElement('a');a2.href=URL.createObjectURL(b);a2.download='hifz-backup-'+todayIso()+'.json';a2.click();return}
    case 'import':$('#file').click();return;
    case 'reset':if(confirm('Erase all your hifz data on this device? This cannot be undone.')){localStorage.removeItem(LS);state=defState();draft=null;cache=null;tab='today'}else return;break;
  }
  render()});
function keepScroll(){const m=$('#mlist');const y=m?m.scrollTop:0,wy=window.scrollY;render();const m2=$('#mlist');if(m2)m2.scrollTop=y;window.scrollTo(0,wy)}
document.addEventListener('change',ev=>{
  const t=ev.target;if(t.id==='file'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(s.v!==1)throw 0;state=Object.assign(defState(),s);save();cache=null;draft=null;render();alert('Backup restored ✓')}catch(e){alert('That file is not a valid backup.')}};r.readAsText(f);return}
  const a=t.dataset.a;if(!a)return;
  if(a==='theme'){state.settings.theme=t.value;save();render();return}
  if(!draft)return;const s=draft.settings;
  if(a==='mchk'){const n=+t.dataset.n;draft.base[n]=t.checked?'all':'';keepScroll();return}
  if(a==='mtxt'){const n=+t.dataset.n;draft.base[n]=t.value.trim();const chk=t.closest('.msurah').querySelector('[data-a=mchk]');chk.checked=false;refreshEst();return}
  if(a==='unit')s.unitWords=Math.max(6,Math.min(40,+t.value||12));
  if(a==='p1u')s.p1Units=+t.value;if(a==='p1w')s.p1Weeks=Math.max(0,+t.value||0);if(a==='p2u')s.p2Units=+t.value;
  if(a==='sdate')draft.startDate=t.value;if(a==='rest')s.restDay=+t.value;if(a==='mmin')s.manzilMin=Math.max(5,+t.value||10);if(a==='name')draft.name=t.value;
  refreshEst()});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.a==='mtxt'&&draft){draft.base[+t.dataset.n]=t.value.trim()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__hifz={get state(){return state},genLessons,plan:()=>plan(),TOTAL,render};
render();
})();
</script>
